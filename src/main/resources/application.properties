spring.application.name=${SERVICE_NAME:temporal-java-sumo-observability}
server.port=8080
logging.level.root=INFO
logging.level.com.example.demo=${APP_LOG_LEVEL:DEBUG}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.service=${SERVICE_NAME:temporal-java-sumo-observability}
management.metrics.tags.deployment_environment=${DEPLOYMENT_ENVIRONMENT:local}
management.metrics.tags.temporal_namespace=${TEMPORAL_NAMESPACE:default}
management.metrics.tags.temporal_task_queue=${TEMPORAL_TASK_QUEUE:HELLO_TASK_QUEUE}
