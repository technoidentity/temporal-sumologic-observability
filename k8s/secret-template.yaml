apiVersion: v1
kind: Secret
metadata:
  name: temporal-java-sumo-secrets
  namespace: temporal-observability
  labels:
    app.kubernetes.io/name: temporal-java-sumo-observability
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Required only when the worker connects to Temporal Cloud API-key auth.
  # Leave the Secret out for a local/self-hosted Temporal frontend that does not use this key.
  temporalApiKey: replace-with-temporal-api-key
