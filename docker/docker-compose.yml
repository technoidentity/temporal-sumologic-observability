services:
  springboot-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: springboot-app
    ports:
      - "8080:8080"
    # Connection values are read from .env when present.
    # In Compose, the local Temporal service is reachable as temporal:7233,
    # not localhost:7233.
    env_file:
      - path: ../.env
        required: false
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-temporal-java-sumo-observability}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-docker-local}
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-HELLO_TASK_QUEUE}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
    depends_on:
      - temporal

  temporal:
    image: temporalio/temporal:latest
    container_name: temporal
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  sumologic-otel-collector:
    image: public.ecr.aws/sumologic/sumologic-otel-collector:latest
    container_name: sumologic-otel-collector
    user: "0:0"
    # Sumo access credentials, the local OTLP source endpoint, and Temporal credentials are read from .env.
    env_file:
      - path: ../.env
        required: false
    command:
      - --config
      - /etc/otel/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
      - /var/lib/otelcol-sumo/file_storage:/var/lib/otelcol-sumo/file_storage
      - /var/lib/otelcol-sumo/credentials:/etc/otel/.sumologic-otel-collector
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - springboot-app



      
