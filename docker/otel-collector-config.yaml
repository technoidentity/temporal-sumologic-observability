exporters:
  sumologic:
    sending_queue:
      enabled: true
    decompose_otlp_histograms: true

extensions:
  sumologic:
    installation_token: ${env:SUMOLOGIC_INSTALLATION_TOKEN}

receivers:
  file_log:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_path: true
    start_at: end
    operators:
      - type: json_parser
        on_error: drop
      - type: filter
        expr: 'not (attributes["log"] matches ".*(com\\.example\\.|DemoApplication).*")'
      - type: move
        from: attributes.log
        to: body

  prometheus:
    config:
      scrape_configs:
        - job_name: springboot-app
          scrape_interval: 15s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["springboot-app:8080"]
          relabel_configs:
            - target_label: _sourceCategory
              replacement: temporal-java-worker
          metric_relabel_configs:
            - source_labels: [namespace]
              regex: (.+)
              target_label: temporal_namespace
              replacement: $1
            - regex: "^namespace$"
              action: labeldrop

        - job_name: temporal-cloud
          scheme: https
          metrics_path: /v1/metrics
          honor_timestamps: true
          scrape_interval: 30s
          scrape_timeout: 10s
          authorization:
            type: Bearer
            credentials: ${env:TEMPORAL_CLOUD_METRICS_API_KEY}
          params:
            namespaces:
              - ${env:TEMPORAL_NAMESPACE}
          static_configs:
            - targets: ["metrics.temporal.io"]
          relabel_configs:
            - target_label: service
              replacement: temporal-cloud

processors:
  batch:
    timeout: 5s
  resource/logs:
    attributes:
      - key: _sourceCategory
        value: temporal-java-worker
        action: upsert
      - key: _sourceName
        value: springboot-app
        action: upsert

service:
  extensions: [sumologic]
  pipelines:
    logs:
      receivers: [file_log]
      processors: [resource/logs, batch]
      exporters: [sumologic]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [sumologic]
